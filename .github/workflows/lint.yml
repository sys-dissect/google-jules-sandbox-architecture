name: Lint Markdown and Diagrams

on:
  push:
    branches: ["main", "jules-*"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install MarkdownLint and Mermaid CLI
        run: |
          npm install -g markdownlint-cli @mermaid-js/mermaid-cli

      - name: Run MarkdownLint
        run: |
          markdownlint '**/*.md' --ignore node_modules || true

      - name: Validate Mermaid Diagrams in ARCHITECTURE.md
        run: |
          echo '{"args": ["--no-sandbox"]}' > /tmp/puppeteer-config.json
          python3 - << 'EOF'
          import re, subprocess, sys
          content = open('ARCHITECTURE.md').read()
          blocks = re.findall(r'```mermaid\n(.*?)\n```', content, re.DOTALL)
          print(f"Validating {len(blocks)} Mermaid diagrams from ARCHITECTURE.md...")
          for idx, b in enumerate(blocks):
              fname = f'/tmp/diag_{idx}.mmd'
              with open(fname, 'w') as f:
                  f.write(b)
              res = subprocess.run(['mmdc', '-p', '/tmp/puppeteer-config.json', '-i', fname, '-o', f'/tmp/diag_{idx}.svg'])
              if res.returncode != 0:
                  print(f"Mermaid diagram {idx} failed syntax validation")
                  sys.exit(1)
          print(f"Successfully validated all {len(blocks)} Mermaid diagrams!")
          EOF

name: Lint Markdown and Diagrams

on:
  push:
    branches: ["main", "jules-*"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MarkdownLint and Mermaid CLI
        run: |
          npm install -g markdownlint-cli @mermaid-js/mermaid-cli

      - name: Run MarkdownLint
        run: |
          markdownlint '**/*.md' --ignore node_modules || true

      - name: Validate Mermaid Diagrams in ARCHITECTURE.md
        run: |
          # Extract mermaid blocks and validate syntax
          python3 -c "
          import re, subprocess, sys
          content = open('ARCHITECTURE.md').read()
          blocks = re.findall(r'```mermaid\n(.*?)\n```', content, re.DOTALL)
          for idx, b in enumerate(blocks):
              fname = f'/tmp/diag_{idx}.mmd'
              with open(fname, 'w') as f:
                  f.write(b)
              res = subprocess.run(['mmdc', '-i', fname, '-o', f'/tmp/diag_{idx}.svg'])
              if res.returncode != 0:
                  print(f'Diagram {idx} failed syntax check')
                  sys.exit(1)
          print(f'Successfully validated {len(blocks)} Mermaid diagrams')
          "
